apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name | quote }}
  labels:
    app.kubernetes.io/name: ai-gateway
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ai-gateway
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
  ports:
  - name: http
    port: {{ .Values.service.port }}
    targetPort: http
