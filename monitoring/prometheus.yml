global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: ai-gateway
    metrics_path: /metrics/prometheus
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics
    static_configs:
      - targets: [gateway:8000]
