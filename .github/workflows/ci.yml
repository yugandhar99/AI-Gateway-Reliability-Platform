name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Python unit tests
        run: python -m unittest discover -v
      - name: Compile Python and validate Stage 7 monitoring panels
        run: |
          python -m compileall -q gateway scripts tests
          python scripts/validate_incident_dashboard.py
      - name: Isolated Stage 7 detection and approval guard (no remediation)
        run: python scripts/simulate_incident.py --directory monitoring/runtime/ci-stage7
      - name: Build image (no push)
        run: docker build --tag ai-gateway:stage5 .
      - name: Isolated container smoke checks
        run: python scripts/ci_container_smoke.py
      - name: Install pinned validation tools with checksum verification
        run: bash scripts/install_ci_tools.sh
      - name: Validate Helm and Kubernetes
        run: |
          python -m pip install --disable-pip-version-check PyYAML==6.0.3
          python scripts/validate_infra.py

      - name: Initialize isolated monitoring stack
        run: python scripts/setup_monitoring.py
      - name: Validate monitoring configuration and alert behavior
        run: |
          docker compose --env-file .env.monitoring -f compose.monitoring.yaml config --quiet
          docker compose --env-file .env.monitoring -f compose.monitoring.yaml run --rm --no-deps --entrypoint promtool prometheus check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint promtool -v "$PWD/monitoring:/etc/prometheus:ro" -w /etc/prometheus prom/prometheus:v3.7.3 check rules alerts.yml
          docker run --rm --entrypoint promtool -v "$PWD/monitoring:/etc/prometheus:ro" -w /etc/prometheus prom/prometheus:v3.7.3 test rules alerts.test.yml
      - name: Start monitoring stack
        run: docker compose --env-file .env.monitoring -f compose.monitoring.yaml up -d --build --wait --wait-timeout 120
      - name: Verify monitoring integration
        run: python scripts/check_monitoring.py
      - name: Safe monitoring startup diagnostics
        if: failure()
        run: python scripts/check_monitoring.py --diagnostics
      - name: Stop only monitoring services (retain data)
        if: always()
        run: docker compose --env-file .env.monitoring -f compose.monitoring.yaml stop
