name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Python unit tests
        run: python -m unittest discover -v
      - name: Build image (no push)
        run: docker build --tag ai-gateway:stage5 .
      - name: Isolated container smoke checks
        run: python scripts/ci_container_smoke.py
      - name: Install pinned validation tools with checksum verification
        run: bash scripts/install_ci_tools.sh
      - name: Validate Helm and Kubernetes
        run: |
          python -m pip install --disable-pip-version-check PyYAML==6.0.3
          python scripts/validate_infra.py
